workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^ci\/(batch|local)-/
    - if: $CI_COMMIT_TAG

default:
  tags: [docker]

check:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.20
  timeout: 5m
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git >/dev/null
    - base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
    - |
      if [ "$base" = "0000000000000000000000000000000000000000" ]; then
        if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
          echo "cannot identify a root commit in a shallow clone" >&2
          exit 1
        fi
        head=$(git rev-parse HEAD) || exit 1
        ancestry=$(git rev-list --parents -n 1 HEAD) || exit 1
        if [ "$ancestry" = "$head" ]; then
          echo "root commit: no previous commit"
          exit 0
        fi
        base=$(git rev-parse --verify HEAD^) || exit 1
      fi
      if [ -z "$base" ]; then
        echo "missing diff base" >&2
        exit 1
      elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
        echo "diff base is not available in the full clone" >&2
        exit 1
      else
        git diff --check "$base" HEAD
      fi

quality:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/chialab/php:${PHP_VERSION}
  timeout: 20m
  retry:
    max: 1
    exit_codes: [100]
  parallel:
    matrix:
      - PHP_VERSION: ["8.4", "8.5"]
  variables:
    COMPOSER_ALLOW_SUPERUSER: "1"
    COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer
  cache:
    key: composer-files-php$PHP_VERSION
    paths: [.cache/composer/files/]
  before_script:
    - php --version
    - |
      curl --fail --silent --show-error --location https://getcomposer.org/download/2.11.1/composer.phar --output /tmp/composer.phar
      echo '6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c  /tmp/composer.phar' | sha256sum --check
      install -m 0755 /tmp/composer.phar /usr/local/bin/composer
    - composer --version
    - unset OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY
    - |
      for extension in dom curl libxml mbstring zip pcntl pdo pdo_sqlite; do
        if ! php -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' "$extension"; then
          install-php-extensions "$extension"
        fi
      done
  script:
    - composer validate --no-check-publish
    - test "$(composer config policy.advisories.block)" = true
    - composer install --prefer-dist --no-interaction --no-progress
    - composer audit --format=json > composer-audit.json
    - composer show --format=json > dependency-versions.json
    - vendor/bin/pest tests --fail-on-skipped --fail-on-incomplete
    - vendor/bin/phpstan analyse --memory-limit=2G
  artifacts:
    when: always
    paths: [composer-audit.json, dependency-versions.json]
